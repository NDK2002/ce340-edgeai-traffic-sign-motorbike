; [H2] Firmware test ngoại vi ghi-đông: OLED 1.3" SH1106, Buzzer passive PWM, LED đỏ & nút bấm
; Tương thích mạch ESP32-S3-CAM N16R8 (Freenove / devkitc-1)
; Build:   pio run
; Nạp:     pio run -t upload
; Xem log: pio device monitor

[env:esp32s3_n16r8]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = espidf
platform_packages = platformio/tool-cmake@~3.30.2

board_build.flash_mode = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
