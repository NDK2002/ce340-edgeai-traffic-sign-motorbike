<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="gnd">
      <line x1="0" y1="-10" x2="0" y2="0" stroke="#222" stroke-width="2.5"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#222" stroke-width="2.5"/>
      <line x1="-8" y1="5" x2="8" y2="5" stroke="#222" stroke-width="2.5"/>
      <line x1="-4" y1="10" x2="4" y2="10" stroke="#222" stroke-width="2.5"/>
    </g>
  </defs>
  <rect width="900" height="850" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Sơ đồ đấu nối ngoại vi — ESP32-S3-CAM N16R8</text>

  <!-- ===== Bo mạch ===== -->
  <rect x="60" y="60" width="320" height="700" rx="14" fill="#24476b" stroke="#16314d" stroke-width="3"/>
  <rect x="90" y="85" width="200" height="150" rx="6" fill="#c9ced6" stroke="#8a929e" stroke-width="2"/>
  <rect x="90" y="85" width="200" height="28" rx="6" fill="#aab1bc"/>
  <text x="190" y="104" text-anchor="middle" font-size="11" fill="#333">ăng-ten</text>
  <text x="190" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ESP32-S3-WROOM-1</text>
  <rect x="150" y="166" width="80" height="28" rx="4" fill="#fff3cd" stroke="#d97706" stroke-width="2"/>
  <text x="190" y="186" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">N16R8</text>
  <text x="190" y="222" text-anchor="middle" font-size="11" fill="#444">Flash 16 MB · PSRAM 8 MB</text>

  <rect x="110" y="290" width="120" height="110" rx="8" fill="#2d2d2d" stroke="#555" stroke-width="2"/>
  <circle cx="170" cy="340" r="32" fill="#111" stroke="#777" stroke-width="3"/>
  <circle cx="170" cy="340" r="13" fill="#2b4a7a"/>
  <circle cx="164" cy="334" r="4" fill="#9fb8e0"/>
  <text x="170" y="392" text-anchor="middle" font-size="13" fill="#fff">OV2640</text>
  <rect x="150" y="400" width="40" height="40" fill="#c08a2b" opacity="0.85"/>
  <text x="200" y="428" font-size="10" fill="#dfe7f0">cáp camera</text>

  <text x="80" y="722" font-size="12" fill="#dfe7f0">2 cổng USB-C (nạp code + nguồn 5V)</text>
  <rect x="110" y="732" width="56" height="18" rx="7" fill="#bfc5cc" stroke="#7b838c"/>
  <rect x="230" y="732" width="56" height="18" rx="7" fill="#bfc5cc" stroke="#7b838c"/>

  <!-- Nhãn chân bo -->
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">
    <text x="364" y="115">3V3</text>
    <text x="364" y="145">GND</text>
    <text x="364" y="175">GPIO42</text>
    <text x="364" y="205">GPIO41</text>
    <text x="364" y="283">5V</text>
    <text x="364" y="325">GPIO14</text>
    <text x="364" y="485">GPIO1</text>
    <text x="364" y="615">GPIO21</text>
    <text x="364" y="693">GPIO47</text>
  </g>
  <g fill="#e5c07b" stroke="#8a6d2f">
    <rect x="374" y="104" width="12" height="12"/><rect x="374" y="134" width="12" height="12"/>
    <rect x="374" y="164" width="12" height="12"/><rect x="374" y="194" width="12" height="12"/>
    <rect x="374" y="272" width="12" height="12"/><rect x="374" y="314" width="12" height="12"/>
    <rect x="374" y="474" width="12" height="12"/><rect x="374" y="604" width="12" height="12"/>
    <rect x="374" y="682" width="12" height="12"/>
  </g>

  <!-- ===== OLED 1.3" ===== -->
  <text x="745" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">OLED 1.3" I2C (SH1106, màu trắng)</text>
  <rect x="640" y="80" width="210" height="140" rx="6" fill="#0b1f3a" stroke="#081426" stroke-width="2"/>
  <rect x="700" y="96" width="138" height="108" fill="#000" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="769" cy="150" r="32" fill="#000" stroke="#fff" stroke-width="7"/>
  <text x="769" y="159" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">50</text>
  <g font-size="11" fill="#cfe0ff">
    <text x="648" y="114">VCC</text><text x="648" y="144">GND</text>
    <text x="648" y="174">SCL</text><text x="648" y="204">SDA</text>
  </g>
  <line x1="386" y1="110" x2="640" y2="110" stroke="#e67e22" stroke-width="3.5"/>
  <line x1="386" y1="140" x2="640" y2="140" stroke="#222" stroke-width="3.5"/>
  <line x1="386" y1="170" x2="640" y2="170" stroke="#15803d" stroke-width="3.5"/>
  <line x1="386" y1="200" x2="640" y2="200" stroke="#1d4ed8" stroke-width="3.5"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="512" y="104">3V3 → VCC</text>
    <text x="512" y="134">GND → GND</text>
    <text x="512" y="164">SCL (xung nhịp I2C)</text>
    <text x="512" y="194">SDA (dữ liệu I2C)</text>
  </g>

  <!-- ===== Buzzer passive (kênh phụ) ===== -->
  <text x="410" y="252" font-size="14" font-weight="bold" fill="#111">Buzzer passive 5V — kênh phụ, âm lượng vừa</text>
  <line x1="386" y1="278" x2="780" y2="278" stroke="#d62828" stroke-width="3.5"/>
  <text x="430" y="272" font-size="12" fill="#d62828">5V</text>
  <line x1="386" y1="320" x2="470" y2="320" stroke="#7c3aed" stroke-width="3.5"/>
  <text x="400" y="314" font-size="10" fill="#7c3aed">PWM</text>
  <rect x="470" y="308" width="80" height="24" rx="4" fill="#f5deb3" stroke="#8b5a2b" stroke-width="2"/>
  <text x="510" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a1a">R 1kΩ</text>
  <line x1="550" y1="320" x2="600" y2="320" stroke="#7c3aed" stroke-width="3.5"/>
  <rect x="600" y="290" width="80" height="90" rx="8" fill="#333" stroke="#111" stroke-width="2"/>
  <text x="640" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S8050</text>
  <text x="640" y="348" text-anchor="middle" font-size="10" fill="#ccc">NPN</text>
  <g font-size="11" font-weight="bold" fill="#ffd166">
    <text x="606" y="316">B</text><text x="668" y="304">C</text><text x="668" y="372">E</text>
  </g>
  <line x1="680" y1="300" x2="780" y2="300" stroke="#7c3aed" stroke-width="3.5"/>
  <line x1="680" y1="362" x2="720" y2="362" stroke="#222" stroke-width="3.5"/>
  <line x1="720" y1="362" x2="720" y2="382" stroke="#222" stroke-width="3.5"/>
  <use href="#gnd" x="720" y="392"/>
  <rect x="780" y="262" width="90" height="52" rx="10" fill="#1b1b1b" stroke="#000" stroke-width="2"/>
  <text x="825" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">BUZZER</text>
  <text x="825" y="303" text-anchor="middle" font-size="10" fill="#bbb">passive 5V</text>
  <text x="772" y="274" text-anchor="end" font-size="13" font-weight="bold" fill="#d62828">+</text>
  <text x="772" y="314" text-anchor="end" font-size="13" font-weight="bold" fill="#222">−</text>

  <!-- ===== Motor rung (kênh chính) ===== -->
  <text x="410" y="434" font-size="14" font-weight="bold" fill="#111">Motor rung ở tay nắm — kênh chính, không gây ồn</text>
  <line x1="386" y1="480" x2="470" y2="480" stroke="#7c3aed" stroke-width="3.5"/>
  <rect x="470" y="468" width="80" height="24" rx="4" fill="#f5deb3" stroke="#8b5a2b" stroke-width="2"/>
  <text x="510" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a1a">R 1kΩ</text>
  <line x1="550" y1="480" x2="600" y2="480" stroke="#7c3aed" stroke-width="3.5"/>
  <rect x="600" y="466" width="80" height="80" rx="8" fill="#333" stroke="#111" stroke-width="2"/>
  <text x="640" y="506" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S8050</text>
  <text x="640" y="521" text-anchor="middle" font-size="10" fill="#ccc">NPN</text>
  <g font-size="11" font-weight="bold" fill="#ffd166">
    <text x="606" y="484">B</text><text x="668" y="484">C</text><text x="668" y="540">E</text>
  </g>
  <line x1="680" y1="480" x2="806" y2="480" stroke="#7c3aed" stroke-width="3.5"/>
  <line x1="680" y1="536" x2="720" y2="536" stroke="#222" stroke-width="3.5"/>
  <line x1="720" y1="536" x2="720" y2="552" stroke="#222" stroke-width="3.5"/>
  <use href="#gnd" x="720" y="562"/>

  <rect x="696" y="440" width="44" height="18" rx="4" fill="#fdebd3" stroke="#e67e22" stroke-width="2"/>
  <text x="718" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">3V3</text>
  <line x1="740" y1="449" x2="806" y2="449" stroke="#e67e22" stroke-width="3.5"/>
  <line x1="770" y1="449" x2="770" y2="480" stroke="#555" stroke-width="2"/>
  <polygon points="762,476 778,476 770,462" fill="#555"/>
  <line x1="761" y1="461" x2="779" y2="461" stroke="#555" stroke-width="3"/>
  <text x="758" y="474" text-anchor="end" font-size="10" fill="#555">1N4148</text>

  <circle cx="834" cy="465" r="28" fill="#c0c6cf" stroke="#6b7280" stroke-width="3"/>
  <text x="834" y="471" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">M</text>
  <text x="834" y="510" text-anchor="middle" font-size="11" fill="#333">motor rung 3V</text>
  <text x="834" y="524" text-anchor="middle" font-size="10" fill="#555">dán ở tay nắm</text>

  <!-- ===== LED ===== -->
  <text x="410" y="590" font-size="14" font-weight="bold" fill="#111">Đèn LED đỏ siêu sáng</text>
  <line x1="386" y1="610" x2="470" y2="610" stroke="#7c3aed" stroke-width="3.5"/>
  <rect x="470" y="598" width="80" height="24" rx="4" fill="#f5deb3" stroke="#8b5a2b" stroke-width="2"/>
  <text x="510" y="615" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a1a">R 330Ω</text>
  <line x1="550" y1="610" x2="600" y2="610" stroke="#7c3aed" stroke-width="3.5"/>
  <polygon points="600,592 600,628 634,610" fill="#e63946" stroke="#9b1c26" stroke-width="2"/>
  <line x1="634" y1="592" x2="634" y2="628" stroke="#9b1c26" stroke-width="3"/>
  <line x1="612" y1="588" x2="622" y2="574" stroke="#e63946" stroke-width="2"/>
  <line x1="624" y1="588" x2="634" y2="574" stroke="#e63946" stroke-width="2"/>
  <line x1="634" y1="610" x2="718" y2="610" stroke="#222" stroke-width="3.5"/>
  <line x1="718" y1="610" x2="718" y2="626" stroke="#222" stroke-width="3.5"/>
  <use href="#gnd" x="718" y="636"/>
  <text x="560" y="646" font-size="11" fill="#555">(+) chân dài</text>
  <text x="626" y="646" font-size="11" fill="#555">(−) chân ngắn</text>

  <!-- ===== Nút nhấn ===== -->
  <text x="410" y="672" font-size="13" font-weight="bold" fill="#111">Nút tắt cảnh báo (chống nước)</text>
  <line x1="386" y1="688" x2="600" y2="688" stroke="#7c3aed" stroke-width="3.5"/>
  <circle cx="604" cy="688" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="650" cy="688" r="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="604" y1="676" x2="650" y2="676" stroke="#222" stroke-width="3"/>
  <line x1="627" y1="676" x2="627" y2="664" stroke="#222" stroke-width="3"/>
  <line x1="654" y1="688" x2="690" y2="688" stroke="#222" stroke-width="3.5"/>
  <line x1="690" y1="688" x2="690" y2="700" stroke="#222" stroke-width="3.5"/>
  <use href="#gnd" x="690" y="710"/>

  <!-- ===== Chân S8050 ===== -->
  <rect x="740" y="590" width="140" height="150" rx="8" fill="#f6f7f9" stroke="#c9ced6"/>
  <text x="810" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Chân S8050</text>
  <path d="M785,620 h50 v38 h-50 Z" fill="#222"/>
  <text x="810" y="643" text-anchor="middle" font-size="10" fill="#fff">S8050</text>
  <line x1="795" y1="658" x2="795" y2="695" stroke="#888" stroke-width="3"/>
  <line x1="810" y1="658" x2="810" y2="695" stroke="#888" stroke-width="3"/>
  <line x1="825" y1="658" x2="825" y2="695" stroke="#888" stroke-width="3"/>
  <g font-size="13" font-weight="bold" fill="#111" text-anchor="middle">
    <text x="795" y="711">E</text><text x="810" y="711">B</text><text x="825" y="711">C</text>
  </g>
  <text x="810" y="730" text-anchor="middle" font-size="10" fill="#555">mặt có chữ hướng về mình</text>

  <!-- ===== Chú thích ===== -->
  <g font-size="12" fill="#333">
    <line x1="60" y1="790" x2="86" y2="790" stroke="#222" stroke-width="4"/><text x="92" y="794">GND</text>
    <line x1="140" y1="790" x2="166" y2="790" stroke="#e67e22" stroke-width="4"/><text x="172" y="794">3.3V</text>
    <line x1="220" y1="790" x2="246" y2="790" stroke="#d62828" stroke-width="4"/><text x="252" y="794">5V</text>
    <line x1="290" y1="790" x2="316" y2="790" stroke="#1d4ed8" stroke-width="4"/><text x="322" y="794">SDA</text>
    <line x1="370" y1="790" x2="396" y2="790" stroke="#15803d" stroke-width="4"/><text x="402" y="794">SCL</text>
    <line x1="450" y1="790" x2="476" y2="790" stroke="#7c3aed" stroke-width="4"/><text x="482" y="794">tín hiệu GPIO</text>
    <use href="#gnd" x="600" y="788"/><text x="618" y="794">= nối chung về chân GND của bo</text>
  </g>
  <text x="450" y="822" text-anchor="middle" font-size="11" fill="#777">Ô "3V3" = nối về chân 3V3 của bo. Diode: vạch trắng (catốt) về phía 3V3. Chân camera, PSRAM (33–37), thẻ SD (38–40), USB (19, 20, 43, 44) đã bận.</text>
  <text x="450" y="840" text-anchor="middle" font-size="11" fill="#777">Kiểm tra lại sơ đồ in trên bo và thứ tự chân in trên OLED khi nhận hàng.</text>
</svg>
