; Firmware cảnh báo biển báo: camera → cắt ROI → model phân loại → OLED + LED + buzzer
; Build:   pio run
; Nạp:     pio run -t upload
; Xem log: pio device monitor

[platformio]
; Mặc định chỉ build/nạp bản cho bo thật; bản mô phỏng phải gọi rõ "-e wokwi"
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = espidf
; CMake mặc định (3.16.4) chỉ có bản Intel x86 → lỗi "Bad CPU type" trên Mac M1/M2/M3.
platform_packages = platformio/tool-cmake@~3.30.2

; Module N16R8: Flash 16 MB (QIO) + PSRAM 8 MB (Octal). PSRAM bật trong sdkconfig.defaults
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Bản mô phỏng Wokwi (chưa có bo): không dùng camera/PSRAM, chạy kịch bản src/sim_scenario.h.
; Build (từ gốc repo): ./05_firmware_esp32s3/pio.sh traffic_sign_alert run -e wokwi
[env:wokwi]
extends = env:esp32s3_n16r8
build_flags = -DCE340_SIM=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;wokwi.sdkconfig"
