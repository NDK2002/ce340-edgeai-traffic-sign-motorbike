; Firmware cảnh báo biển báo: camera → cắt ROI → model phân loại → OLED + LED + buzzer
; Build:   pio run
; Nạp:     pio run -t upload
; Xem log: pio device monitor

[env:esp32s3_n16r8]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = espidf
; CMake mặc định (3.16.4) chỉ có bản Intel x86 → lỗi "Bad CPU type" trên Mac M1/M2/M3.
platform_packages = platformio/tool-cmake@~3.30.2

; Module N16R8: Flash 16 MB (QIO) + PSRAM 8 MB (Octal). PSRAM bật trong sdkconfig.defaults
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
