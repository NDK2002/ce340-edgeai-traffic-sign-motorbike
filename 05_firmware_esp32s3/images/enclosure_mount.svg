<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
    <pattern id="foam" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fde68a"/>
      <circle cx="4" cy="4" r="1.6" fill="#d97706"/>
    </pattern>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Hộp thiết bị gắn ghi-đông — nhìn từ bên hông xe</text>

  <!-- Hướng xe chạy -->
  <line x1="640" y1="62" x2="830" y2="62" stroke="#111" stroke-width="3" marker-end="url(#arr)"/>
  <text x="735" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Hướng xe chạy</text>

  <!-- Vùng nhìn camera + biển báo -->
  <polygon points="548,187 860,112 860,262" fill="#93c5fd" opacity="0.28"/>
  <line x1="548" y1="187" x2="860" y2="112" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="548" y1="187" x2="860" y2="262" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="797" y="150" width="6" height="200" fill="#6b7280"/>
  <circle cx="800" cy="140" r="22" fill="#fff" stroke="#d62828" stroke-width="7"/>
  <text x="800" y="147" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">50</text>
  <line x1="560" y1="350" x2="860" y2="350" stroke="#9ca3af" stroke-width="2"/>
  <text x="700" y="372" text-anchor="middle" font-size="12" fill="#555">lề đường bên phải</text>

  <!-- Người lái -->
  <circle cx="110" cy="112" r="28" fill="#fde2c8" stroke="#a16207" stroke-width="2"/>
  <path d="M82,104 Q110,70 138,104" fill="#6b7280"/>
  <circle cx="128" cy="114" r="3" fill="#111"/>
  <line x1="132" y1="118" x2="330" y2="188" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="70" y="166" font-size="12" fill="#16a34a">Người lái liếc xuống</text>
  <text x="70" y="182" font-size="12" fill="#16a34a">màn hình OLED</text>

  <!-- Ghi-đông + giá kẹp -->
  <circle cx="430" cy="330" r="30" fill="none" stroke="#374151" stroke-width="6"/>
  <circle cx="430" cy="330" r="20" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <rect x="424" y="248" width="12" height="54" fill="#374151"/>
  <rect x="330" y="240" width="200" height="10" rx="3" fill="#374151"/>
  <rect x="326" y="200" width="10" height="50" rx="3" fill="#374151"/>
  <rect x="524" y="200" width="10" height="50" rx="3" fill="#374151"/>

  <!-- Hộp -->
  <rect x="340" y="150" width="180" height="90" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="3"/>
  <rect x="356" y="164" width="148" height="66" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="370" y="188" width="125" height="16" rx="2" fill="#24476b"/>
  <text x="432" y="200" text-anchor="middle" font-size="10" fill="#fff">bo ESP32-S3-CAM</text>
  <rect x="362" y="206" width="138" height="20" fill="url(#foam)" stroke="#d97706"/>

  <!-- Camera phía trước -->
  <rect x="520" y="175" width="22" height="24" fill="#222"/>
  <circle cx="535" cy="187" r="7" fill="#2b4a7a" stroke="#888" stroke-width="2"/>
  <line x1="548" y1="166" x2="548" y2="208" stroke="#60a5fa" stroke-width="5" opacity="0.8"/>

  <!-- Tản nhiệt trên module -->
  <rect x="420" y="178" width="40" height="10" fill="#9ca3af"/>
  <rect x="422" y="170" width="4" height="8" fill="#9ca3af"/><rect x="430" y="170" width="4" height="8" fill="#9ca3af"/>
  <rect x="438" y="170" width="4" height="8" fill="#9ca3af"/><rect x="446" y="170" width="4" height="8" fill="#9ca3af"/>
  <rect x="454" y="170" width="4" height="8" fill="#9ca3af"/>
  <!-- Gói hút ẩm -->
  <rect x="372" y="170" width="22" height="14" rx="3" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="383" y="180" text-anchor="middle" font-size="7" fill="#57534e">ẩm</text>

  <!-- OLED + LED phía sau, có mái che nắng -->
  <rect x="328" y="166" width="12" height="44" fill="#0b1f3a" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="340,156 302,148 302,153 340,162" fill="#374151"/>
  <circle cx="334" cy="224" r="5" fill="#e63946"/>

  <!-- Ốc siết cáp PG7 -->
  <rect x="362" y="240" width="16" height="10" fill="#6b7280"/>
  <text x="430" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Hộp kín nước IP65 (màu sáng)</text>

  <!-- Cáp nguồn + sạc dự phòng -->
  <path d="M370,240 C360,300 300,330 240,330" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="226" y="320" width="30" height="20" rx="3" fill="#0ea5e9" stroke="#0369a1"/>
  <text x="241" y="334" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">mA</text>
  <path d="M226,330 L200,330" stroke="#111" stroke-width="3"/>
  <rect x="100" y="306" width="100" height="48" rx="8" fill="#334155"/>
  <text x="150" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Sạc dự phòng</text>
  <text x="150" y="342" text-anchor="middle" font-size="10" fill="#cbd5e1">5V / 2A</text>

  <!-- Nhãn -->
  <g font-size="12" fill="#111">
    <line x1="304" y1="149" x2="262" y2="124" stroke="#111"/>
    <text x="180" y="120">Mái che nắng</text>
    <line x1="548" y1="166" x2="590" y2="96" stroke="#111"/>
    <text x="594" y="94">Mica trong suốt che mưa</text>
    <line x1="531" y1="200" x2="590" y2="246" stroke="#111"/>
    <text x="594" y="250">Camera lệch phải ~10–15°</text>
    <line x1="328" y1="210" x2="300" y2="236" stroke="#111"/>
    <text x="118" y="250">OLED + LED hướng về người lái</text>
    <line x1="500" y1="222" x2="560" y2="292" stroke="#111"/>
    <text x="564" y="296">Mút xốp lót dưới bo: chống rung</text>
    <line x1="526" y1="238" x2="560" y2="318" stroke="#111"/>
    <text x="564" y="322">Giá kẹp nhôm chống rung, có khớp xoay</text>
    <line x1="460" y1="340" x2="560" y2="342" stroke="#111"/>
    <text x="564" y="346" font-weight="bold">Ghi-đông</text>
    <line x1="241" y1="340" x2="241" y2="380" stroke="#111"/>
    <text x="120" y="396">USB tester (đo dòng mA cho báo cáo)</text>
  </g>
  <text x="440" y="414" text-anchor="middle" font-size="11" fill="#777">Trong hộp: bo dán VHB trên mút EVA, tản nhiệt trên module, gói hút ẩm. Cáp ra qua ốc siết PG7, đi dọc ghi-đông bằng dây rút.</text>
</svg>
